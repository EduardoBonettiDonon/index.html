<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Jogos</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    padding: 30px;
}

.container {
    max-width: 1200px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 40px;
}

.formulario {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
    flex-wrap: wrap;
}

input {
    flex: 1;
    min-width: 250px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}

button {
    padding: 14px 22px;
    border: none;
    border-radius: 10px;
    background: #22c55e;
    color: white;
    font-size: 16px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #16a34a;
}

.lista {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 16px;
    transition: 0.2s;
}

.card:hover {
    transform: scale(1.03);
}

.card h2 {
    margin-bottom: 15px;
}

.card a {
    display: inline-block;
    text-decoration: none;
    color: #60a5fa;
    font-weight: bold;
}

.footer {
    text-align: center;
    margin-top: 40px;
    opacity: 0.7;
}

</style>
</head>
<body>

<div class="container">

    <h1>🎮 Central de Jogos</h1>

    <div class="formulario">

        <input type="text" id="nome" placeholder="Nome do jogo">

        <input type="text" id="link" placeholder="Link do jogo">

        <button onclick="adicionarJogo()">
            Adicionar
        </button>

    </div>

    <div class="lista" id="lista"></div>

    <div class="footer">
        Site criado em HTML + CSS + JavaScript
    </div>

</div>

<script>

const jogosPadrao = [
    {
        nome: "Minecraft",
        link: "https://www.minecraft.net"
    },
    {
        nome: "Roblox",
        link: "https://www.roblox.com"
    },
    {
        nome: "Fortnite",
        link: "https://www.fortnite.com"
    },
    {
        nome: "Free Fire",
        link: "https://ff.garena.com"
    },
    {
        nome: "Valorant",
        link: "https://playvalorant.com"
    },
    {
        nome: "League of Legends",
        link: "https://www.leagueoflegends.com"
    },
    {
        nome: "Counter Strike 2",
        link: "https://store.steampowered.com/app/730/CounterStrike_2/"
    },
    {
        nome: "GTA V",
        link: "https://www.rockstargames.com/gta-v"
    },
    {
        nome: "Rocket League",
        link: "https://www.rocketleague.com"
    },
    {
        nome: "Among Us",
        link: "https://www.innersloth.com/games/among-us/"
    }
];

if (!localStorage.getItem("jogos")) {
    localStorage.setItem("jogos", JSON.stringify(jogosPadrao));
}

function pegarJogos() {
    return JSON.parse(localStorage.getItem("jogos")) || [];
}

function salvarJogos(jogos) {
    localStorage.setItem("jogos", JSON.stringify(jogos));
}

function renderizarJogos() {

    const lista = document.getElementById("lista");

    const jogos = pegarJogos();

    lista.innerHTML = "";

    jogos.forEach((jogo, index) => {

        lista.innerHTML += `
        <div class="card">
            <h2>${jogo.nome}</h2>

            <a href="${jogo.link}" target="_blank">
                Abrir jogo
            </a>

            <br><br>

            <button onclick="removerJogo(${index})">
                Remover
            </button>
        </div>
        `;
    });
}

function adicionarJogo() {

    const nome = document.getElementById("nome").value;
    const link = document.getElementById("link").value;

    if (!nome || !link) {
        alert("Preencha tudo");
        return;
    }

    const jogos = pegarJogos();

    jogos.push({ nome, link });

    salvarJogos(jogos);

    document.getElementById("nome").value = "";
    document.getElementById("link").value = "";

    renderizarJogos();
}

function removerJogo(index) {

    const jogos = pegarJogos();

    jogos.splice(index, 1);

    salvarJogos(jogos);

    renderizarJogos();
}

renderizarJogos();

</script>

</body>
</html>
